<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0f18" />
<title>RELOQ Driver — offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
         background: #0a0f18; color: #f1f4f8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  .card { max-width: 360px; padding: 28px 22px; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; background: #141c2a; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #8a949e; line-height: 1.5; margin: 0 0 18px; font-size: 15px; }
  a.btn { display: block; padding: 14px; border-radius: 12px; background: #ff3f34; color: #fff; font-weight: 700; font-size: 16px; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <img src="/driver-icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Your labor timer keeps running on our server. Reconnect to see your jobs and tap Pause or Stop.</p>
    <a class="btn" href="/driver">Try again</a>
  </div>
</body>
</html>
